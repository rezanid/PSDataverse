name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test PSDataverse.sln --configuration Release --verbosity normal

      - name: Build module package
        shell: pwsh
        run: |
          Import-Module ./build.psm1 -Force
          Start-PSDataverseBuild -Output ./output/PSDataverse

      - name: Smoke-test packaged module
        shell: pwsh
        run: |
          ./tests/SmokeTest-Module.ps1 -ModulePath ./output/PSDataverse/PSDataverse.psd1

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Analyze PowerShell sources
        shell: pwsh
        run: |
          $issues = @(Invoke-ScriptAnalyzer -Path ./src/Module -Recurse -Severity Error)
          if ($issues.Count -ne 0) {
            $issues | Format-Table -AutoSize
            throw "$($issues.Count) PowerShell analyzer errors found."
          }

      - name: Test packaged module contract
        shell: pwsh
        run: |
          $container = New-PesterContainer -Path ./tests/PSDataverse.Module.Tests.ps1 -Data @{ ModulePath = './output/PSDataverse/PSDataverse.psd1' }
          $result = Invoke-Pester -Container $container -PassThru -CI
          if ($result.FailedCount -ne 0) {
            throw "$($result.FailedCount) packaged-module tests failed."
          }

      - name: Install minimum PowerShell host
        run: dotnet tool install --tool-path ./output/pwsh74 PowerShell --version 7.4.19

      - name: Smoke-test minimum PowerShell host
        shell: pwsh
        run: |
          $executable = if ($IsWindows) { './output/pwsh74/pwsh.exe' } else { './output/pwsh74/pwsh' }
          & $executable -NoLogo -NoProfile -File ./tests/SmokeTest-Module.ps1 -ModulePath ./output/PSDataverse/PSDataverse.psd1
          if ($LASTEXITCODE -ne 0) {
            throw "PowerShell 7.4 module smoke test failed with exit code $LASTEXITCODE."
          }

      - name: Audit NuGet dependencies
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $audit = dotnet list PSDataverse.sln package --vulnerable --include-transitive
          if ($LASTEXITCODE -ne 0) {
            throw "The NuGet vulnerability audit failed to run: $audit"
          }
          if ($audit -match 'has the following vulnerable packages') {
            throw "The NuGet vulnerability audit found vulnerable packages: $audit"
          }
