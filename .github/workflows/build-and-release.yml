name: Build, verify, and publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified release candidate to PowerShell Gallery
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-release-candidate:
    uses: ./.github/workflows/verify-package.yml

  publish:
    name: Publish the verified artifact
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    needs: verify-release-candidate
    runs-on: ubuntu-latest
    environment:
      name: PowerShell Gallery

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: PSDataverse-2-rc
          path: output/packages

      - name: Install pinned publishing dependency
        shell: pwsh
        run: >-
          ./tools/Install-BuildDependencies.ps1
          -Name Microsoft.PowerShell.PSResourceGet

      - name: Publish the exact validated package
        shell: pwsh
        env:
          POWERSHELL_GALLERY_API_KEY: ${{ secrets.POWERSHELL_GALLERY_API_KEY }}
        run: |
          $package = @(Get-ChildItem ./output/packages -Filter '*.nupkg' -File)
          $checksum = @(Get-ChildItem ./output/packages -Filter '*.sha256' -File)
          if ($package.Count -ne 1 -or $checksum.Count -ne 1) {
            throw 'The validated artifact must contain one package and one checksum.'
          }
          $expectedHash = ((Get-Content $checksum[0].FullName -Raw) -split '\s+')[0]
          $actualHash = (Get-FileHash $package[0].FullName -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Package checksum mismatch: expected $expectedHash; got $actualHash."
          }
          Import-Module `
            ./output/build-modules/Microsoft.PowerShell.PSResourceGet/1.2.0/Microsoft.PowerShell.PSResourceGet.psd1 `
            -Force
          Publish-PSResource -NupkgPath $package[0].FullName `
            -Repository PSGallery -ApiKey $env:POWERSHELL_GALLERY_API_KEY
