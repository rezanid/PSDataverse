name: Build, verify, and publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package to PowerShell Gallery
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  POWERSHELL_VERSION: 7.6.5

jobs:
  package:
    runs-on: ubuntu-latest
    environment:
      name: PowerShell Gallery

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test .NET
        run: dotnet test PSDataverse.sln --configuration Release --verbosity normal

      - name: Install PowerShell 7.6
        run: >-
          dotnet tool install --tool-path ./output/pwsh76 PowerShell
          --version ${{ env.POWERSHELL_VERSION }}

      - name: Build and verify deterministic package
        shell: pwsh
        run: |
          & ./output/pwsh76/pwsh -NoLogo -NoProfile -File `
            ./tools/New-PSDataversePackage.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Package verification failed with exit code $LASTEXITCODE."
          }

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: PSDataverse-2-preview
          path: |
            output/packages/*.nupkg
            output/packages/*.sha256
          if-no-files-found: error

      - name: Publish verified package
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          POWERSHELL_GALLERY_API_KEY: ${{ secrets.POWERSHELL_GALLERY_API_KEY }}
        run: |
          $package = @(Get-ChildItem ./output/packages -Filter '*.nupkg' -File)
          if ($package.Count -ne 1) {
            throw "Expected one verified package; found $($package.Count)."
          }
          Import-Module `
            ./output/build-modules/Microsoft.PowerShell.PSResourceGet/1.2.0/Microsoft.PowerShell.PSResourceGet.psd1 `
            -Force
          Publish-PSResource -NupkgPath $package[0].FullName `
            -Repository PSGallery -ApiKey $env:POWERSHELL_GALLERY_API_KEY
